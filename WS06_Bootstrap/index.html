<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap School Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Brand</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h1 class="text-center">My Bootstrap Project</h1>
      <p class="lead text-center">Ready to start building!</p>

      <div class="row mt-4">
        <div class="col-md-4 col-12">Column 1</div>
        <div class="col-md-4 col-12">Column 2</div>
        <div class="col-md-4 col-12">Column 3</div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
      </div>

      <div class="card mt-4" style="width: 18rem">
        <img src="stock_image.jpg" class="card-img-top" alt="Card Image" />
        <div class="card-body">
          <h2 class="card-title">Card Title</h2>
          <p class="card-text">This is a simple card example using Bootstrap.</p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>

      <div class="alert alert-warning mt-4" role="alert">
        This is a warning alert—check it out!
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
